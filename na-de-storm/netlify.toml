# Netlify-configuratie voor NA DE STORM (statische Vite-site).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Onbekende paden tonen public/404.html, die terugverwijst naar de ingang.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Schoolproject met beschermde afbeeldingen: niet laten indexeren.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
