<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6f2"/>
      <stop offset="0.5" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#e2f1ff"/>
    </linearGradient>
    <radialGradient id="candy" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffd7ea"/>
      <stop offset="0.62" stop-color="#ff8ec0"/>
      <stop offset="1" stop-color="#c93f76"/>
    </radialGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd7ea"/>
      <stop offset="0.5" stop-color="#ff8ec0"/>
      <stop offset="1" stop-color="#c93f76"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- wrapper twists -->
  <path d="M120 256 L58 192 L74 256 L58 320 Z" fill="url(#wrap)"/>
  <path d="M392 256 L454 192 L438 256 L454 320 Z" fill="url(#wrap)"/>

  <!-- candy body -->
  <circle cx="256" cy="256" r="140" fill="url(#candy)"/>

  <!-- swirl -->
  <path d="M256 256 m0 -112 a112 112 0 1 1 -79 33 a79 79 0 1 0 79 -33"
        fill="none" stroke="#fffdf8" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
  <path d="M256 256 m0 -56 a56 56 0 1 1 -40 17"
        fill="none" stroke="#fffdf8" stroke-width="26" stroke-linecap="round" opacity="0.85"/>

  <!-- gloss -->
  <ellipse cx="205" cy="196" rx="52" ry="34" fill="#ffffff" opacity="0.55" transform="rotate(-28 205 196)"/>
  <circle cx="192" cy="184" r="15" fill="#ffffff" opacity="0.9"/>

  <!-- sparkles -->
  <path d="M400 116 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9 z" fill="#ffcf47"/>
  <path d="M108 372 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#9a6bff" opacity="0.85"/>
</svg>
