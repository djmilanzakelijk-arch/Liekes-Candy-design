<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Candy Fruit ASMR</title>
<style>
  @font-face {
    font-family: 'Baloo 2';
    font-weight: 800;
    src: url('baloo2-800-latin.woff2') format('woff2');
  }
  html, body { margin: 0; height: 100%; background: #1b1220; }
  body { display: grid; place-items: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; }
  body.capture canvas { height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { setup, render, DURATION } from './scene.js';

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const info = await setup();
  window.SCENE = { ...info, render: t => render(ctx, t) };

  if (new URLSearchParams(location.search).has('capture')) {
    document.body.classList.add('capture');
    window.READY = true;
  } else {
    // Live preview (silent): loops the clip in real time.
    const t0 = performance.now();
    const tick = now => {
      render(ctx, ((now - t0) / 1000) % DURATION);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
